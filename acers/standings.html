<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ACeRS Autumn 2025 championship standings archive."><title>2025/26 Standings | ACeRS</title>
  <link rel="stylesheet" href="../css/site.css?v=20260811">
</head>
<body>
<nav class="top-nav"><div class="top-nav-inner"><a href="../index.html" class="nav-logo"><div class="nav-title"><div class="nav-main">Army Cycling eRacing</div><div class="nav-sub">Army Cycling eRace Series</div></div></a><div class="nav-links"><a href="./index.html">ACeRS Home</a><a href="./riders.html">Riders</a><a class="active" href="./standings.html">2025/26 Standings</a><a href="../mmm.html">MMM</a></div></div></nav>
<main class="section-shell acers-data-page">
  <section class="data-page-hero"><div class="eyebrow">2025/26 ARCHIVE • COMPLETE</div><h1>Autumn 2025 <span>Standings</span></h1><p>Historical ACeRS championship data used to test the new Army Cycling eRacing site ahead of the 2026/27 season.</p></section>
  <div class="standings-tabs" role="tablist"><button class="active" data-view="points">Championship</button><button data-view="sprint">Sprint</button><button data-view="kom">KOM</button><button data-view="gc">GC</button><button data-view="corps">Corps</button></div>
  <section class="data-toolbar standings-filter" id="riderFilters"><select id="standingCompetition"><option value="Open">Open Competition</option><option value="Female">Female Competition</option></select><select id="standingCat"><option value="">All categories</option><option>A</option><option>B</option><option>C</option><option>D</option></select></section>
  <div class="standing-description" id="standingDescription"></div>
  <section class="acers-table-wrap"><table class="acers-table standings-table"><thead id="standingHead"></thead><tbody id="standingRows"><tr><td class="loading-cell">Loading…</td></tr></tbody></table></section>
  <a class="back-link" href="./index.html">← Back to ACeRS</a>
</main>
<script src="./acers.js"></script>
<script>
let data, view='points';
const descriptions={points:'Overall championship points from the Autumn 2025 six-race series.',sprint:'Season sprint-prime points.',kom:'Season King/Queen of the Mountains prime points.',gc:'Cumulative General Classification time across the series.',corps:'Corps competition totals across all six races.'};
function renderStanding(){
  const rowsEl=document.getElementById('standingRows'), head=document.getElementById('standingHead');
  document.getElementById('standingDescription').textContent=descriptions[view];
  const filters=document.getElementById('riderFilters'); filters.style.display=view==='corps'?'none':'flex';
  if(view==='corps'){
    head.innerHTML='<tr><th>Pos</th><th>Corps</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>R5</th><th>R6</th><th>Total</th></tr>';
    rowsEl.innerHTML=data.standings.corps.map(r=>`<tr><td class="position-cell">${esc(r.position)}</td><td><strong>${esc(r.corps)}</strong></td>${r.races.map(v=>`<td>${v??'—'}</td>`).join('')}<td><strong>${r.total??'—'}</strong></td></tr>`).join(''); return;
  }
  const competition=document.getElementById('standingCompetition').value, cat=document.getElementById('standingCat').value;
  let rows=data.standings[view].filter(r=>(!competition||r.competition===competition)&&(!cat||r.cat===cat));
  if(view==='gc') head.innerHTML='<tr><th>Pos</th><th>Rider</th><th>Corps</th><th>Cat</th><th>Time</th><th>Gap</th></tr>';
  else head.innerHTML='<tr><th>Pos</th><th>Rider</th><th>Corps</th><th>Cat</th><th>Total</th></tr>';
  rowsEl.innerHTML=rows.length?rows.map(r=>{const rider=findRider(data,r.zwiftId); return `<tr><td class="position-cell">${esc(r.position)}</td><td><a class="rider-name-link" href="./profile.html?id=${encodeURIComponent(r.zwiftId)}">${esc(r.name)}</a>${rider&&!rider.verified?'<div class="table-sub unverified-text">Not verified</div>':''}</td><td>${esc(r.corps)}</td><td><span class="cat-box cat-${esc(r.cat)}">${esc(r.cat)}</span></td>${view==='gc'?`<td><strong>${formatExcelDuration(r.time)}</strong></td><td>${esc(r.timeGap||'—')}</td>`:`<td><strong>${r.total??'—'}</strong></td>`}</tr>`}).join(''):'<tr><td colspan="6" class="loading-cell">No standings for this filter.</td></tr>';
}
loadAcersData().then(d=>{data=d; renderStanding(); document.querySelectorAll('.standings-tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.standings-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');view=btn.dataset.view;renderStanding();})); document.getElementById('standingCompetition').addEventListener('change',renderStanding);document.getElementById('standingCat').addEventListener('change',renderStanding);}).catch(err=>document.getElementById('standingRows').innerHTML=`<tr><td class="loading-cell">${esc(err.message)}</td></tr>`);
</script>
</body></html>
