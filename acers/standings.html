<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Standings | ACeRS</title><link rel="stylesheet" href="../css/site.css?v=20260811-acers3"></head><body>
<nav class="top-nav"><div class="top-nav-inner"><a href="../index.html" class="nav-logo"><div class="nav-title"><div class="nav-main">Army Cycling eRacing</div><div class="nav-sub">Army Cycling eRace Series</div></div></a><div class="nav-links"><a href="./index.html">ACeRS Home</a><a data-series-link="riders" href="./riders.html">Riders</a><a data-series-link="results" href="./results.html">Results</a><a class="active" data-series-link="standings" href="./standings.html">Standings</a><a data-series-link="schedule" href="./schedule.html">Schedule</a><a href="./rules.html">Rules</a><a href="./archive.html">Archive</a></div></div></nav>
<main class="section-shell acers-data-page"><section class="data-page-hero"><div class="eyebrow" id="standingEyebrow">2025/26 ARCHIVE</div><h1 id="standingTitle">Loading <span>Standings</span></h1><p id="standingIntro">Loading competition standings…</p></section><div class="series-switcher" id="seriesSwitcher"></div>
<div class="standings-tabs" role="tablist"><button class="active" data-view="points">Overall</button><button data-view="sprint">Sprint</button><button data-view="kom">KOM</button><button data-view="gc">GC</button><button data-view="corps">Corps</button></div>
<section class="data-toolbar standings-filter" id="riderFilters"><select id="standingCompetition"><option value="Open">Open Competition</option><option value="Female">Female Competition</option></select><select id="standingCorps"><option value="">All Corps</option></select><select id="standingCat"><option value="">All categories</option><option>A</option><option>B</option><option>C</option><option>D</option></select><input id="standingSearch" type="search" placeholder="Search rider…"><button class="btn secondary export-btn" id="standingCsv">Export CSV</button><button class="btn secondary export-btn" id="standingPdf">Export PDF / Print</button></section><div class="standing-description" id="standingDescription"></div>
<section class="acers-table-wrap"><table class="acers-table standings-table"><thead id="standingHead"></thead><tbody id="standingRows"><tr><td class="loading-cell">Loading…</td></tr></tbody></table></section><a class="back-link" href="./index.html">← Back to ACeRS</a></main>
<script src="./config.js"></script><script src="./acers.js"></script><script>
let data,view='points';const sid=getSeriesId();renderSeriesSelector('seriesSwitcher',sid);updateSeriesNav(sid);
function available(view){return Array.isArray(data.standings?.[view])&&data.standings[view].length>0;}
function setAvailableTabs(){document.querySelectorAll('.standings-tabs button').forEach(btn=>btn.hidden=!available(btn.dataset.view));if(!available(view)){const first=[...document.querySelectorAll('.standings-tabs button')].find(b=>!b.hidden);if(first){view=first.dataset.view;document.querySelectorAll('.standings-tabs button').forEach(b=>b.classList.toggle('active',b===first));}}}
function populateStandingCorps(){const values=[...new Set(['points','sprint','kom','gc'].flatMap(k=>(data.standings?.[k]||[]).map(r=>r.corps)).filter(Boolean))].sort();document.getElementById('standingCorps').innerHTML='<option value="">All Corps</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');}
function currentStandingExport(){if(view==='corps'){const raceCount=data.meta.races||0,headers=['Pos','Corps',...Array.from({length:raceCount},(_,i)=>`R${i+1}`),'Total'],rows=(data.standings.corps||[]).map(r=>[r.position,r.corps,...r.races,r.total??'']);return{headers,rows,count:rows.length};}const competition=document.getElementById('standingCompetition').value,corps=document.getElementById('standingCorps').value,cat=document.getElementById('standingCat').value,q=document.getElementById('standingSearch').value.trim().toLowerCase(),filtered=(data.standings[view]||[]).filter(r=>(!competition||r.competition===competition)&&(!corps||r.corps===corps)&&(!cat||!r.cat||r.cat===cat)&&(!q||`${r.name} ${r.corps}`.toLowerCase().includes(q))),hasCat=filtered.some(r=>r.cat);const headers=['Pos','Rider','Corps'];if(hasCat)headers.push('Cat');if(view==='gc')headers.push('Time','Gap');else headers.push('Total');const rows=filtered.map(r=>{const row=[r.position,r.name,r.corps];if(hasCat)row.push(r.cat||'');if(view==='gc')row.push(formatExcelDuration(r.time),r.timeGap||'');else row.push(r.total??'');return row;});return{headers,rows,count:rows.length};}
function standingFilterLabels(){if(view==='corps')return['Corps competition'];return[document.getElementById('standingCompetition').value?`Competition: ${document.getElementById('standingCompetition').value}`:'',document.getElementById('standingCorps').value?`Corps: ${document.getElementById('standingCorps').value}`:'',document.getElementById('standingCat').value?`Category: ${document.getElementById('standingCat').value}`:'',document.getElementById('standingSearch').value.trim()?`Search: ${document.getElementById('standingSearch').value.trim()}`:''];}
function exportStandingCsv(){const x=currentStandingExport(),corps=document.getElementById('standingCorps').value;downloadCsv(`ACeRS_${safeFilePart(data.meta.label)}_${safeFilePart(view)}_${safeFilePart(corps||'All_Corps')}.csv`,x.headers,x.rows);}
function exportStandingPdf(){const x=currentStandingExport(),corps=document.getElementById('standingCorps').value;printFilteredReport({title:`${data.meta.label} – ${view==='points'?standingsLabel(data.meta):view.toUpperCase()}`,subtitle:view==='corps'?'Corps standings':'Official ACeRS standings',filters:[...standingFilterLabels(),`${x.count} row${x.count===1?'':'s'}`],headers:x.headers,rows:x.rows,jerseyCorps:view==='corps'?'':corps});}
function renderStanding(){const rowsEl=document.getElementById('standingRows'),head=document.getElementById('standingHead'),isChamp=data.meta.type==='championship';document.getElementById('standingDescription').textContent=view==='points'?(isChamp?'Overall Championship points.':'Overall seasonal series points.'):view==='sprint'?'Season Sprint-prime points.':view==='kom'?'Season KOM-prime points.':view==='gc'?'Cumulative General Classification time.':'Corps competition totals.';const filters=document.getElementById('riderFilters');filters.hidden=view==='corps';if(view==='corps'){const raceCount=data.meta.races||0;head.innerHTML=`<tr><th>Pos</th><th>Corps</th>${Array.from({length:raceCount},(_,i)=>`<th>R${i+1}</th>`).join('')}<th>Total</th></tr>`;rowsEl.innerHTML=data.standings.corps.map(r=>`<tr><td class="position-cell">${esc(r.position)}</td><td><strong>${esc(r.corps)}</strong></td>${r.races.map(v=>`<td>${v??'—'}</td>`).join('')}<td><strong>${r.total??'—'}</strong></td></tr>`).join('');return;}const competition=document.getElementById('standingCompetition').value,corps=document.getElementById('standingCorps').value,cat=document.getElementById('standingCat').value,q=document.getElementById('standingSearch').value.trim().toLowerCase();let rows=(data.standings[view]||[]).filter(r=>(!competition||r.competition===competition)&&(!corps||r.corps===corps)&&(!cat||!r.cat||r.cat===cat)&&(!q||`${r.name} ${r.corps}`.toLowerCase().includes(q)));const hasCat=rows.some(r=>r.cat);document.getElementById('standingCat').style.display=hasCat?'':'none';if(view==='gc')head.innerHTML=`<tr><th>Pos</th><th>Rider</th><th>Corps</th>${hasCat?'<th>Cat</th>':''}<th>Time</th><th>Gap</th></tr>`;else head.innerHTML=`<tr><th>Pos</th><th>Rider</th><th>Corps</th>${hasCat?'<th>Cat</th>':''}<th>Total</th></tr>`;rowsEl.innerHTML=rows.length?rows.map(r=>`<tr><td class="position-cell">${esc(r.position)}</td><td><a class="rider-name-link" href="${profileUrl(r.zwiftId,sid)}">${esc(r.name)}</a></td><td>${esc(r.corps)}</td>${hasCat?`<td>${r.cat?`<span class="cat-box cat-${esc(r.cat)}">${esc(r.cat)}</span>`:'—'}</td>`:''}${view==='gc'?`<td><strong>${formatExcelDuration(r.time)}</strong></td><td>${esc(r.timeGap||'—')}</td>`:`<td><strong>${r.total??'—'}</strong></td>`}</tr>`).join(''):`<tr><td colspan="6" class="loading-cell">No standings for this filter.</td></tr>`;}
loadAcersData(sid).then(d=>{data=d;document.title=`${standingsLabel(d.meta)} | ${d.meta.label} | ACeRS`;document.getElementById('standingEyebrow').textContent=`${d.meta.season} ARCHIVE • ${d.meta.type==='championship'?'CHAMPIONSHIP':'SERIES'}`;document.getElementById('standingTitle').innerHTML=`${esc(d.meta.label)} <span${d.meta.type==='championship'?' class="championship-accent"':''}>${esc(standingsLabel(d.meta))}</span>`;document.getElementById('standingIntro').textContent=d.meta.type==='championship'?'Official standings from the single 2025/26 Army eRace Championship competition.':'Official standings from this ACeRS seasonal series.';setAvailableTabs();populateStandingCorps();renderStanding();document.querySelectorAll('.standings-tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.standings-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');view=btn.dataset.view;renderStanding();}));document.getElementById('standingCompetition').addEventListener('change',renderStanding);document.getElementById('standingCorps').addEventListener('change',renderStanding);document.getElementById('standingCat').addEventListener('change',renderStanding);document.getElementById('standingSearch').addEventListener('input',renderStanding);document.getElementById('standingCsv').addEventListener('click',exportStandingCsv);document.getElementById('standingPdf').addEventListener('click',exportStandingPdf);}).catch(err=>document.getElementById('standingRows').innerHTML=`<tr><td class="loading-cell">${esc(err.message)}</td></tr>`);
</script></body></html>
