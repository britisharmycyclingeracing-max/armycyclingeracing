<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rider Profile | ACeRS</title><link rel="stylesheet" href="../css/site.css?v=20260811-acers3"></head><body>
<nav class="top-nav"><div class="top-nav-inner"><a href="../index.html" class="nav-logo"><div class="nav-title"><div class="nav-main">Army Cycling eRacing</div><div class="nav-sub">Army Cycling eRace Series</div></div></a><div class="nav-links"><a href="./index.html">ACeRS Home</a><a class="active" data-series-link="riders" href="./riders.html">Riders</a><a data-series-link="results" href="./results.html">Results</a><a data-series-link="standings" href="./standings.html">Standings</a><a data-series-link="schedule" href="./schedule.html">Schedule</a><a href="./archive.html">Archive</a></div></div></nav>
<main class="section-shell acers-data-page" id="profileRoot"><div class="profile-loading">Loading rider profile…</div></main><script src="./config.js"></script><script src="./acers.js"></script><script>
const params=new URLSearchParams(location.search),id=params.get('id'),sid=getSeriesId(),root=document.getElementById('profileRoot');updateSeriesNav(sid);
function metric(label,entry,type='points'){if(!entry)return'';const value=type==='gc'?formatExcelDuration(entry.time):(entry.total??'—');return`<div class="profile-metric"><span>${esc(label)}</span><strong>${esc(value)}</strong><small>${entry.position?`Position ${esc(entry.position)}`:'No position'}</small></div>`;}
loadAcersData(sid).then(data=>{const rider=findRider(data,id);if(!rider){root.innerHTML=`<section class="data-page-hero"><h1>Rider not found</h1><p>No registered rider matches that Zwift ID.</p></section><a class="back-link" href="./riders.html?series=${sid}">← Back to Riders</a>`;return;}const s=standingsForRider(data,id),raceCount=Number(data.meta.races||data.races?.length||0),racePoints=s.points?.races||Array(raceCount).fill(null),isChamp=data.meta.type==='championship';document.title=`${rider.name} | ${data.meta.label} | ACeRS`;const metrics=[metric(isChamp?'Championship points':'Series points',s.points),metric('Sprint points',s.sprint),metric('KOM points',s.kom),metric('General classification',s.gc,'gc')].filter(Boolean).join('');root.innerHTML=`
<section class="profile-header"><div><div class="eyebrow">ACeRS RIDER PROFILE • ${esc(data.meta.season)}</div><h1>${esc(rider.name)}</h1><div class="profile-meta"><span>${esc(rider.corps)}</span><span>${esc(rider.competition)} Competition</span>${rider.cat?`<span>Category ${esc(rider.cat)}</span>`:''}<span>Zwift ID ${esc(rider.zwiftId)}</span></div></div><div>${verifiedBadge(rider.verified)}</div></section>
<div class="series-switcher" id="seriesSwitcher"></div>
${rider.verified?`<section class="verification-message ok"><strong>✓ Membership verified</strong><p>This rider is eligible to count in official ACeRS results.</p></section>`:`<section class="verification-message warning"><strong>Membership not verified</strong><p>This rider is registered, but their Army Cycling membership has not been verified. Their participation may therefore not appear or count in the official ${isChamp?'Championship':'Series'} results.</p></section>`}
<section class="profile-section"><div class="section-heading"><div><div class="eyebrow">${esc(data.meta.label).toUpperCase()}</div><h2>${isChamp?'Championship':'Series'} record</h2></div><a href="${standingsUrl(sid)}">View ${esc(standingsLabel(data.meta).toLowerCase())} →</a></div>${metrics?`<div class="metric-grid metric-grid-dynamic">${metrics}</div>`:'<div class="series-empty-note">No official standing is recorded for this rider in this competition.</div>'}</section>
<section class="profile-section"><div class="section-heading"><div><div class="eyebrow">RACE HISTORY</div><h2>Race-by-race points</h2></div></div><div class="race-history dynamic-races">${racePoints.map((p,i)=>`<div class="race-tile"><a href="${resultsUrl(sid,i+1)}"><span>Race ${i+1}</span><strong>${p??'—'}</strong><small>${p===null||p===undefined?'No score':'points'}</small><span class="race-link">View result →</span></a></div>`).join('')}</div></section>
<div class="profile-actions"><a class="back-link" href="./riders.html?series=${sid}">← Back to Riders</a><a class="btn secondary" href="https://zwiftpower.com/profile.php?z=${encodeURIComponent(rider.zwiftId)}" target="_blank" rel="noopener">ZwiftPower profile ↗</a></div>`;renderSeriesSelector('seriesSwitcher',sid);document.querySelectorAll('#seriesSwitcher a').forEach(a=>{const target=new URL(a.href);target.searchParams.set('id',id);a.href=`./profile.html?${target.searchParams.toString()}`;});}).catch(err=>root.innerHTML=`<div class="profile-loading">${esc(err.message)}</div>`);
</script></body></html>
